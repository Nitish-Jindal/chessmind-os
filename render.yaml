# Render Blueprint — ChessMind OS (backend API + static frontend).
#
# No secrets live here. On first sync Render prompts for every `sync: false`
# value (DATABASE_URL = the Neon connection string, pasted as-is; the backend
# adds the driver prefix and drops channel_binding where asyncpg rejects it).
# JWT_SECRET is generated by Render once and kept across deploys.
services:
  - type: web
    name: chessmind-api
    runtime: python
    plan: free
    region: singapore
    # Free web services have no preDeployCommand, so the build runs
    # migrations and the idempotent opening seed (scripts/render_build.sh).
    buildCommand: bash scripts/render_build.sh
    startCommand: cd backend && uvicorn chessmind.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - scripts/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STOCKFISH_PATH
        # Downloaded by scripts/install_stockfish.sh during the build.
        value: /opt/render/project/src/engines/stockfish-bin
      - key: STOCKFISH_RELEASE
        value: sf_17.1
      - key: CORS_ORIGINS
        value: https://chessmind-web.onrender.com
      - key: CORS_ORIGIN_REGEX
        # Render appends a random suffix when the subdomain is taken.
        value: ^https://chessmind-web(-[a-z0-9]+)?\.onrender\.com$
      # Optional LLM wording of coaching; stays off until a key and model are pasted in.
      - key: LLM_EXPLANATIONS_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: xai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: chessmind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      # react-router owns every path; serve the SPA shell for deep links.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Bare host of the API service; frontend/src/api.ts turns it into
        # https://<host>.onrender.com. Override with a full URL if needed.
        fromService:
          type: web
          name: chessmind-api
          property: host
